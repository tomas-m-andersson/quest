<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mech Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mech Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{
  color-scheme:dark;
  --bg:#0b0d11; --p1:#12161d; --p2:#181d26; --line:#252c39; --line2:#323b4c;
  --text:#e6e9ef; --mute:#8a93a6; --gold:#e3b341; --green:#3ecf8e; --red:#ef5b5b; --c:#2bd4f0;
  --head:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--text);font:600 17px/1.3 var(--body);
  background:
    radial-gradient(700px 380px at 90% -10%,rgba(255,255,255,.045),transparent 60%),
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:1100px;margin:0 auto;padding:10px 14px 70px}
.mute{color:var(--mute)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.logo{font:700 20px var(--head);letter-spacing:.18em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo i{width:9px;height:22px;background:var(--c);transform:skewX(-20deg);display:block}
.logo b{color:var(--c);font-weight:700}
.topr{display:flex;align-items:center;gap:10px;min-width:0}
.sync{font:600 12px var(--head);letter-spacing:.04em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.sync[data-k="ok"]{color:var(--green)} .sync[data-k="err"]{color:var(--red)} .sync[data-k="busy"]{color:var(--gold)}
.ib{width:42px;height:42px;display:grid;place-items:center;background:var(--p1);border:1px solid var(--line2);border-radius:8px;font-size:19px;flex:none}
.hint{background:rgba(227,179,65,.08);border:1px solid rgba(227,179,65,.35);color:#f0d58a;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:15px}

/* avatar box */
.av{display:block;flex:none;border-radius:10px;overflow:hidden;line-height:0;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 24%,#12161d),#0d1117 72%);
  border:1px solid var(--line2);border:1px solid color-mix(in srgb,var(--c) 55%,#252c39)}
.av svg{display:block}

/* hero tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tab{display:flex;gap:10px;align-items:center;text-align:left;min-width:0;padding:10px;background:var(--p1);border:1px solid var(--line);border-radius:10px;position:relative}
.tab.sel{border-color:var(--c);box-shadow:inset 0 2px 0 var(--c),0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.tinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.tname{font:700 15px var(--head);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12.5px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:block;height:10px;background:#0a0d12;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar.thin{height:6px}
.bar>i{display:block;height:100%;background:var(--c);transition:width .5s cubic-bezier(.2,.9,.3,1);
  background-image:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.28) 9px 10px)}

/* panel */
.panel{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;position:relative}
.panel::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;background:var(--c)}
.phead{display:flex;gap:14px;align-items:center}
.phead .av{box-shadow:0 0 28px -8px var(--c)}
.pinfo{flex:1;min-width:0}
.pname{font:700 22px var(--head);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prank{font:600 13px var(--head);color:var(--c);letter-spacing:.16em;text-transform:uppercase;margin:1px 0 8px}
.lvrow{display:flex;gap:10px;align-items:center}
.hex{flex:none;width:44px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);color:#0b0d11;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);line-height:1}
.hex small{font:700 9px var(--head);letter-spacing:.1em}
.hex b{font:700 20px var(--head)}
.xpwrap{flex:1;min-width:0}
.xpl{display:flex;justify-content:space-between;color:var(--mute);font-size:13.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.stat{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;font:600 10.5px var(--head);letter-spacing:.14em;color:var(--mute)}
.stat b{font:700 20px var(--head)}
.goalrow .gl{display:flex;justify-content:space-between;gap:8px;font:600 12px var(--head);letter-spacing:.1em;color:var(--mute);margin-bottom:5px;text-transform:uppercase}
.goalrow .gl span:last-child{color:var(--gold);text-align:right}
.goalrow .bar>i{background-color:var(--gold)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pbtns .wide{grid-column:1/-1}
.pbtns .btn{letter-spacing:.05em;padding:11px 8px;white-space:nowrap}
.btn .cnt{margin-left:7px;font-size:11px;color:var(--mute);letter-spacing:.05em}
.btn{background:var(--p2);border:1px solid var(--line2);border-radius:8px;padding:11px 14px;font:700 14px var(--head);letter-spacing:.1em;text-transform:uppercase;position:relative;min-height:44px}
.btn:hover{border-color:#566179}
.btn.pri{background:var(--c);border-color:var(--c);color:#0b0d11}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;min-height:38px}
.newdot{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font:700 10px var(--head);padding:2px 6px;border-radius:99px;letter-spacing:.05em}
.boosts{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.bst{font-size:14.5px;color:var(--mute);border-left:2px solid var(--gold);padding-left:9px}
.bst b{color:var(--gold);font-family:var(--head)}

/* week */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weekbar h2{margin:0;font:700 15px var(--head);letter-spacing:.12em;text-transform:uppercase}
.wnav{display:flex;gap:6px}
.wnav button{background:var(--p1);border:1px solid var(--line2);border-radius:8px;min-width:44px;height:40px;font:700 16px var(--head)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.dp{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:7px 0 0;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;min-height:56px}
.dp .dpn{font:600 11px var(--head);letter-spacing:.1em;color:var(--mute)}
.dp .dpd{font:700 18px var(--head)}
.dp i{display:block;width:100%;height:4px;margin-top:auto;background:var(--line)}
.dp.act{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.dp.s-some i{background:#6b7590} .dp.s-good i{background:var(--green)} .dp.s-perfect i{background:var(--gold)}
.dp.s-future{opacity:.45}

/* calendar */
.cal{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:26px;touch-action:pan-y}
.day{display:none;flex-direction:column;gap:8px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px}
.day.active{display:flex}
.day.today{border-color:#4a5675}
.day.s-good{border-color:rgba(62,207,142,.55)}
.day.s-perfect{border-color:var(--gold);background:linear-gradient(180deg,rgba(227,179,65,.09),var(--p1) 45%)}
.day.locked{opacity:.55}
.dh{display:flex;justify-content:space-between;align-items:baseline}
.dh b{font:700 16px var(--head);letter-spacing:.12em;text-transform:uppercase}
.dh span{color:var(--mute);font-size:14px}
.q{display:grid;grid-template-columns:24px 26px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;
  background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;transition:transform .08s,border-color .15s,background .15s}
.q:active:not(:disabled){transform:scale(.985)}
.q:disabled{cursor:not-allowed}
.chk{width:24px;height:24px;border:2px solid var(--line2);border-radius:6px;position:relative}
.q.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--p2))}
.q.on .chk{background:var(--c);border-color:var(--c)}
.q.on .chk::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid #0b0d11;border-width:0 3px 3px 0;transform:rotate(45deg)}
.q .ic{font-size:21px;text-align:center}
.q .qn{font-size:17px;line-height:1.15}
.q .qn em{display:inline-block;margin-left:7px;font:700 9.5px var(--head);font-style:normal;letter-spacing:.12em;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:1px 4px;vertical-align:middle}
.q .qx{font:700 13px var(--head);color:var(--mute)}
.q.on .qx{color:var(--c)}
.q.on .qn{color:#b9c1d3}
.off{color:var(--mute);text-align:center;padding:18px 0;font-size:16px}
.df{display:flex;justify-content:space-between;align-items:center;margin-top:2px;font-size:14px;color:var(--mute)}
.badge{font:700 11.5px var(--head);letter-spacing:.12em}
.day.s-perfect .badge{color:var(--gold)} .day.s-good .badge{color:var(--green)}
.dxp{font:700 15px var(--head);color:var(--text)}

/* rewards */
h3.sec{font:700 15px var(--head);letter-spacing:.14em;margin:0 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rw{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rw .big{font-size:36px;filter:grayscale(1) brightness(.55)}
.rw .rn{font-size:16px;line-height:1.15}
.rw .rl{font:700 11px var(--head);letter-spacing:.12em;color:var(--mute)}
.rw.open{border-color:var(--gold);background:linear-gradient(180deg,rgba(227,179,65,.12),var(--p1));animation:glow 1.8s ease-in-out infinite}
.rw.open .big{filter:none}
.rw.open .rl{color:var(--gold)}
.rw.done{border-color:rgba(62,207,142,.4)}
.rw.done .big{filter:none;opacity:.6}
.rw.done .rl{color:var(--green)}
.claim{background:var(--gold);color:#1a1200;border:0;border-radius:7px;padding:9px 12px;font:700 12px var(--head);letter-spacing:.1em;min-height:40px}
@keyframes glow{50%{box-shadow:0 0 22px -6px var(--gold)}}


/* spelläge */
#gmov{position:fixed;inset:0;z-index:90;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#gmov canvas{display:block;touch-action:none}
.gmhud{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;pointer-events:none;font-family:var(--head);color:#fff;text-shadow:0 2px 8px #000}
#gmsc{font-size:44px;font-weight:700;line-height:1}
#gmbest{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.gmx{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(8,10,16,.6);color:#fff;font-size:18px}
#gmui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.gmcen{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#fff;padding:20px 24px;max-width:340px;text-shadow:0 2px 10px #000}
.gmcen:not(.over){transform:translateY(-22vh)}
.gmcen b{font:700 26px var(--head);letter-spacing:.1em;text-transform:uppercase}
.gmcen span{font-size:15px;opacity:.9}
.gmtap{font:700 14px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--gold,#e3b341);animation:gmpulse 1.2s infinite alternate}
@keyframes gmpulse{from{opacity:.35}to{opacity:1}}
.gmcen.over{background:rgba(8,10,18,.82);border:1px solid rgba(255,255,255,.2);border-radius:16px;pointer-events:auto;min-width:240px}
.gmbig{font:700 56px var(--head)!important;line-height:1;opacity:1!important}
.gmbtns{display:flex;gap:10px;margin-top:6px}
.gmcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gmcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;background:var(--p2,#141925);border:1px solid var(--line2);border-radius:12px;color:var(--text);font:inherit;min-width:0}
.gmcard b{font:700 14px var(--head);letter-spacing:.08em;text-transform:uppercase}
.gmcard small{font-size:12px;color:var(--mute)}
.gmcard em{font-style:normal;font:700 12px var(--head);color:var(--gold,#e3b341);letter-spacing:.08em}
.gmcard.off{opacity:.55}
.gmth{display:flex;align-items:center;justify-content:center;height:92px;width:100%;font-size:40px}
.gmth svg{max-width:100%;max-height:92px;width:auto;height:auto}
#gmov.rot .gmflip{display:block}.gmflip{display:none;right:66px}
#gmov{overflow:hidden}
#gmfire{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 35% 30%,rgba(255,120,90,.95),rgba(190,40,40,.92));color:#fff;font-size:38px;line-height:1;touch-action:none;box-shadow:0 6px 22px rgba(0,0,0,.55);z-index:3;-webkit-tap-highlight-color:transparent}
#gmjoy{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.04));touch-action:none;z-index:3;box-shadow:0 6px 22px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}
#gmjoy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(150,190,255,.85));box-shadow:0 3px 12px rgba(0,0,0,.5);pointer-events:none}
#gmjoy{font-size:46px;line-height:1;color:#fff;background:radial-gradient(circle at 35% 30%,rgba(130,205,255,.95),rgba(40,90,200,.92));border-color:rgba(255,255,255,.55)}
#gmjoy:active{transform:scale(.93);filter:brightness(1.2)}
#gmfire,#gmjoy{border:3px solid rgba(255,255,255,.85);overflow:hidden;font-size:40px;line-height:1;text-shadow:0 3px 6px rgba(0,0,0,.55);filter:drop-shadow(0 0 0 transparent);transition:transform .06s,filter .06s;
  box-shadow:0 0 0 5px rgba(0,0,0,.28),0 10px 26px rgba(0,0,0,.65),inset 0 4px 7px rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.4)}
#gmfire{background:radial-gradient(circle at 50% 28%,#ff9a6a 0%,#ff4a3a 45%,#a8141c 100%);box-shadow:0 0 0 5px rgba(0,0,0,.28),0 0 22px rgba(255,80,60,.55),0 10px 26px rgba(0,0,0,.65),inset 0 4px 7px rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.4)}
#gmjoy{font-size:50px;background:radial-gradient(circle at 50% 28%,#9fdcff 0%,#3f90f0 45%,#16379a 100%);box-shadow:0 0 0 5px rgba(0,0,0,.28),0 0 22px rgba(80,160,255,.55),0 10px 26px rgba(0,0,0,.65),inset 0 4px 7px rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.4)}
#gmfire::before,#gmjoy::before{content:'';position:absolute;left:14%;right:14%;top:5%;height:38%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
#gmfire::after,#gmjoy::after{content:'';position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(255,255,255,.28);pointer-events:none}
#gmfire:active,#gmjoy:active{transform:scale(.92);filter:brightness(1.25) saturate(1.2)}
#gmfire:active{transform:scale(.93);filter:brightness(1.2)}
@media(max-width:380px){.gmcards{grid-template-columns:1fr}}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,5,9,.82);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.show{display:flex}
.sheet{width:100%;max-width:580px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--p1);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){#modal{align-items:center;padding:16px}.sheet{border-radius:14px;border-bottom:1px solid var(--line2)}}
.sheet h4{font:700 18px var(--head);letter-spacing:.12em;margin:0 0 12px;text-transform:uppercase}
.sheet h5{font:700 11.5px var(--head);margin:18px 0 8px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase}
.sheet p{margin:0 0 4px;font-size:15.5px}
.sheet input,.sheet select{background:#0b0e14;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:10px 11px;font:600 16px var(--body);min-width:0;min-height:44px}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--c);outline-offset:0}
.frow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.frow .grow{flex:1}
.frow .em{width:52px;text-align:center;font-size:20px;padding:6px}
.frow .num{width:72px}
.frow label{color:var(--mute);font-size:15.5px;flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pin{font-size:26px!important;letter-spacing:.4em;text-align:center;width:100%}
.err{color:var(--red);text-align:center;min-height:20px;font-size:15px;margin-top:6px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--p2)}
summary{padding:13px 14px;font:700 13px var(--head);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-size:18px}
details[open] summary::after{content:"–"}
.dbody{padding:2px 12px 12px}
.dchips{display:flex;gap:6px;margin:-2px 0 12px 2px;align-items:center}
.dchips small{color:var(--mute);font-size:12px;letter-spacing:.08em;margin-right:4px}
.dchip{position:relative}
.dchip input{position:absolute;opacity:0;width:0;height:0;min-height:0;padding:0}
.dchip span{display:grid;place-items:center;width:34px;height:30px;border:1px solid var(--line2);border-radius:6px;font:700 13px var(--head);color:var(--mute);background:#0b0e14}
.dchip input:checked+span{background:var(--c);border-color:var(--c);color:#0b0d11}
.dchip input:focus-visible+span{outline:2px solid #fff}
.ownlabel{font:700 12px var(--head);letter-spacing:.1em;color:var(--gold);margin:12px 0 8px;text-transform:uppercase}

/* avatar editor / boost */

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var COLORS={cyan:'#2bd4f0',pink:'#ff5fb0',orange:'#ff9438',green:'#3ecf8e',purple:'#9b8cff',gold:'#e3b341'};
var COLORNAMES={cyan:'Cyan',pink:'Rosa',orange:'Orange',green:'Grön',purple:'Lila',gold:'Guld'};
var DAYS=['Måndag','Tisdag','Onsdag','Torsdag','Fredag'];
var SHORT=['MÅN','TIS','ONS','TOR','FRE'];
var DL=['M','T','O','T','F'];
var MONTHS=['jan','feb','mars','apr','maj','juni','juli','aug','sep','okt','nov','dec'];
var LINES=['Varje dag är ett nytt uppdrag.','Små steg varje dag. Stora nivåer i längden.','Hjältar ger inte upp – de levlar.','Dagens boss: läxorna.','XP kommer av att försöka, inte av att vara perfekt.'];

/* ---------- dates ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var fmt=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
var uid=function(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
function wdOf(ds){return (parse(ds).getDay()+6)%7}
var ALLDAYS=function(){return [true,true,true,true,true]};

/* ---------- state ---------- */
var LS='skolquest.v1';
function defaults(){
  return {
    heroes:[{id:'a',name:'Hjälte 1',color:'cyan'},{id:'b',name:'Hjälte 2',color:'orange'}],
    quests:[
      {id:'q1',icon:'📚',name:'Läxor klara',xp:20,days:ALLDAYS()},
      {id:'q2',icon:'🧠',name:'Fokus på lektionerna',xp:15,days:ALLDAYS()},
      {id:'q3',icon:'📖',name:'Läste 15 minuter',xp:15,days:ALLDAYS()},
      {id:'q4',icon:'🎒',name:'Ordning på väskan',xp:10,days:ALLDAYS()},
      {id:'q5',icon:'😎',name:'Bra attityd',xp:10,days:ALLDAYS()}
    ],
    heroQuests:{a:[],b:[]},
    rewards:[
      {id:'r1',level:2,icon:'🍨',name:'Välj efterrätt'},
      {id:'r2',level:3,icon:'🎮',name:'30 min extra skärmtid'},
      {id:'r3',level:5,icon:'🍿',name:'Filmkväll – du väljer film'},
      {id:'r4',level:7,icon:'🍕',name:'Välj middag'},
      {id:'r5',level:10,icon:'🎢',name:'Egen aktivitet med en förälder'},
      {id:'r6',level:15,icon:'🎳',name:'Bowling eller bio'},
      {id:'r7',level:20,icon:'🎁',name:'Välj en liten present'},
      {id:'r8',level:25,icon:'🏞️',name:'Dagsutflykt – du bestämmer'},
      {id:'r9',level:30,icon:'🏆',name:'Stor belöning – ni bestämmer tillsammans'},
      {id:'r10',level:35,icon:'🧩',name:'Nytt spel eller leksak (liten)'},
      {id:'r11',level:40,icon:'🏕️',name:'Övernattning med kompis'},
      {id:'r12',level:45,icon:'🎡',name:'Nöjespark eller liknande'},
      {id:'r13',level:50,icon:'👑',name:'Mästarbelöning – något riktigt stort'}
    ],
    settings:{pin:'1234',lockTicks:false,goodDayMin:3,perfectBonus:25,weeklyGoal:300,weeklyBonus:75,setupDone:false},
    checks:{a:{},b:{}}, claimed:{a:[],b:[]}, boosts:{a:[],b:[]}, avatar:{}, updatedAt:0
  };
}
function normalize(s){
  var d=defaults();
  s=s||{};
  var o={
    heroes:(s.heroes&&s.heroes.length)?s.heroes:d.heroes,
    quests:Array.isArray(s.quests)?s.quests:d.quests,
    heroQuests:s.heroQuests||{},
    rewards:Array.isArray(s.rewards)?s.rewards:d.rewards,
    settings:Object.assign({},d.settings,s.settings||{}),
    base:s.base||{}, checks:s.checks||{}, claimed:s.claimed||{}, boosts:s.boosts||{}, avatar:s.avatar||{},
    updatedAt:s.updatedAt||0
  };
  var bonus=s.bonus||{};
  var fixDays=function(q){q.days=(Array.isArray(q.days)&&q.days.length===5)?q.days.map(function(v){return v!==false}):ALLDAYS()};
  o.quests.forEach(fixDays);
  o.heroes.forEach(function(h){
    var id=h.id;
    o.checks[id]=o.checks[id]||{};
    o.claimed[id]=o.claimed[id]||[];
    o.heroQuests[id]=o.heroQuests[id]||[];
    o.heroQuests[id].forEach(fixDays);
    o.boosts[id]=o.boosts[id]||[];
    if(bonus[id]&&!o.boosts[id].some(function(b){return b.id==='legacy-'+id}))o.boosts[id].push({id:'legacy-'+id,xp:bonus[id],note:'Tidigare justering',date:fmt(new Date())});
    var av=o.avatar[id]||{};
    av.eq=Object.assign({pose:'',paint:'',head:'',torso:'',shoulders:'',arms:'',waist:'',legs:'',back:'',weapon:'',offhand:'',aura:'',bg:'',emblem:'',banner:'',special:'',vehicle:'',ride:false,vmotor:'',vweapon:'',varmor:'',vcolor:'',pet:''},av.eq||{});
    av.seen=av.seen||1;av.pseen=av.pseen||1;av.petNames=av.petNames||{};
    o.avatar[id]=av;
  });
  return o;
}
function loadLocal(){try{var s=localStorage.getItem(LS);if(s)return JSON.parse(s)}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function newest(a,b){a=a||null;b=b||null;if(!a)return b;if(!b)return a;return (b.updatedAt||0)>(a.updatedAt||0)?b:a}
var S=normalize(newest(loadLocal(),window.SKOLQUEST_DATA));
var selId=S.heroes[0].id;
var viewMon=monday(new Date());
var selDay=(function(){var w=(new Date().getDay()+6)%7;return w<5?w:4})();
var parentUntil=0;

/* ---------- GitHub-synk (data.js i ditt repo) ---------- */
var GHK='skolquest.gh';
function inferGh(){
  var c={owner:'',repo:'',branch:'main',path:'data.js',token:''};
  try{
    var h=location.hostname;
    if(/\.github\.io$/.test(h)){
      c.owner=h.replace('.github.io','');
      var seg=location.pathname.split('/').filter(Boolean)[0];
      c.repo=(seg&&seg.indexOf('.')<0)?seg:h;
    }
  }catch(e){}
  return c;
}
function loadGh(){var c=inferGh();try{var x=JSON.parse(localStorage.getItem(GHK)||'null');if(x)c=Object.assign(c,x)}catch(e){}return c}
function saveGh(){try{localStorage.setItem(GHK,JSON.stringify(GH))}catch(e){}}
var GH=loadGh();
var ghSha=null,ghBusy=false,ghDirty=false,ghTimer=null,ghFatal=false,syncStarted=false;
function ghReady(){return !!(GH.token&&GH.owner&&GH.repo)}
function ghUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+'/contents/'+GH.path.split('/').map(encodeURIComponent).join('/')}
function ghHeaders(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token,'X-GitHub-Api-Version':'2022-11-28'}}
function b64enc(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function b64dec(b64){var s=atob(b64.replace(/\s/g,'')),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
function toFile(){return '// Mech Quest data - uppdateras automatiskt av appen. Redigera inte for hand.\nwindow.SKOLQUEST_DATA = '+JSON.stringify(S,null,2)+';\n'}
function fromFile(txt){var a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('Ogiltig datafil');return JSON.parse(txt.slice(a,b+1))}
function setSync(kind,msg){var e=$('#sync');if(!e)return;e.textContent=msg;e.dataset.k=kind}
function ghErr(st){
  if(st===401)return 'Fel token';
  if(st===403)return 'Token saknar behörighet (eller för många anrop)';
  if(st===404)return 'Hittar inte repot/grenen – kontrollera uppgifterna och tokenens repo-åtkomst';
  if(st===409||st===422)return 'Konflikt';
  return 'GitHub-fel '+st;
}
async function ghPull(){
  var r=await fetch(ghUrl()+'?ref='+encodeURIComponent(GH.branch)+'&_='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404){
    // 404 kan betyda att filen saknas ELLER att repot inte hittas – kolla repot
    var rr=await fetch('https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo),{headers:ghHeaders(),cache:'no-store'});
    if(!rr.ok){var e=new Error(ghErr(rr.status===404?404:rr.status));e.status=rr.status;throw e}
    ghSha=null;return null;
  }
  if(!r.ok){var e2=new Error(ghErr(r.status));e2.status=r.status;throw e2}
  var j=await r.json();ghSha=j.sha;
  return fromFile(b64dec(j.content));
}
async function ghPush(retry){
  var body={message:'Mech Quest: uppdatering '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64enc(toFile()),branch:GH.branch};
  if(ghSha)body.sha=ghSha;
  var r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
  if(r.ok){var j=await r.json();ghSha=j.content.sha;return}
  if((r.status===409||r.status===422)&&!retry){
    var remote=await ghPull();
    if(remote){S=mergeStates(S,normalize(remote));keepSel();saveLocal();render()}
    return ghPush(true);
  }
  var e=new Error(ghErr(r.status));e.status=r.status;throw e;
}
function keepSel(){if(!S.heroes.some(function(h){return h.id===selId}))selId=S.heroes[0].id}
function schedulePush(){
  if(!ghReady())return;
  ghDirty=true;ghFatal=false;setSync('busy','⏳ Sparar…');
  clearTimeout(ghTimer);ghTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!ghReady()||!ghDirty)return;
  if(ghBusy){ghTimer=setTimeout(flush,800);return}
  ghBusy=true;ghDirty=false;
  try{await ghPush(false);setSync('ok','☁️ Synkad')}
  catch(e){
    ghDirty=true;
    if(e.status===401||e.status===403||e.status===404){ghFatal=true;setSync('err','⚠️ '+e.message)}
    else{setSync('err','⚠️ '+(e.message||'Nätverksfel')+' – försöker igen');ghTimer=setTimeout(flush,15000)}
  }
  ghBusy=false;
}
async function refresh(){
  if(!ghReady()||ghBusy||ghDirty)return;
  try{
    var remote=await ghPull();
    setSync('ok','☁️ Synkad');
    if(remote){
      remote=normalize(remote);
      if(remote.updatedAt>S.updatedAt){S=remote;keepSel();saveLocal();render()}
      else if(remote.updatedAt<S.updatedAt){schedulePush()}
    }else if(S.updatedAt){schedulePush()}
  }catch(e){setSync('err','⚠️ '+(e.message||'Nätverksfel'))}
}
function initSync(){
  if(!ghReady()){setSync('off','📴 Sparas bara på den här enheten');return}
  setSync('busy','⏳ Hämtar…');refresh();
  if(syncStarted)return;syncStarted=true;
  setInterval(function(){if(document.visibilityState==='visible'&&!ghFatal)refresh()},60000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!ghFatal)refresh()});
}
function commit(){S.updatedAt=Date.now();saveLocal();schedulePush();render()}



function mergeStates(a,b){
  var newer=(a.updatedAt>=b.updatedAt)?a:b,older=(newer===a)?b:a;
  var o=JSON.parse(JSON.stringify(newer));
  var ids={};[a,b].forEach(function(x){Object.keys(x.checks).forEach(function(h){ids[h]=1})});
  Object.keys(ids).forEach(function(h){
    o.checks[h]=o.checks[h]||{};
    var oc=older.checks[h]||{};
    Object.keys(oc).forEach(function(ds){var cur=o.checks[h][ds]||[];oc[ds].forEach(function(q){if(cur.indexOf(q)<0)cur.push(q)});o.checks[h][ds]=cur});
    o.claimed[h]=o.claimed[h]||[];
    (older.claimed[h]||[]).forEach(function(r){if(o.claimed[h].indexOf(r)<0)o.claimed[h].push(r)});
    o.boosts[h]=o.boosts[h]||[];
    (older.boosts[h]||[]).forEach(function(bb){if(!o.boosts[h].some(function(x){return x.id===bb.id}))o.boosts[h].push(bb)});
  });
  o.updatedAt=Date.now();
  return normalize(o);
}

/* ---------- game logic ---------- */
function heroById(id){return S.heroes.find(function(h){return h.id===id})}
function questsFor(hid,wd){
  var own=(S.heroQuests[hid]||[]).map(function(q){return Object.assign({},q,{own:true})});
  return S.quests.concat(own).filter(function(q){return !q.days||q.days[wd]!==false});
}
function dayIds(hid,ds){
  var ok=questsFor(hid,wdOf(ds)).map(function(q){return q.id});
  return ((S.checks[hid]||{})[ds]||[]).filter(function(id){return ok.indexOf(id)>=0});
}
function dayXp(hid,ds){
  var qs=questsFor(hid,wdOf(ds)),ids=(S.checks[hid]||{})[ds]||[],xp=0,n=0;
  qs.forEach(function(q){if(ids.indexOf(q.id)>=0){xp+=q.xp;n++}});
  if(qs.length&&n===qs.length)xp+=S.settings.perfectBonus;
  return xp;
}
function dayState(hid,ds){
  var qs=questsFor(hid,wdOf(ds)),ids=(S.checks[hid]||{})[ds]||[];
  if(!qs.length)return 'off';
  var n=qs.filter(function(q){return ids.indexOf(q.id)>=0}).length;
  if(n===qs.length)return 'perfect';
  if(n>=Math.min(S.settings.goodDayMin,qs.length))return 'good';
  return n>0?'some':'none';
}
function weekXp(hid,mon){var s=0;for(var i=0;i<5;i++)s+=dayXp(hid,fmt(addDays(mon,i)));return s}
function boostXp(hid){return (S.boosts[hid]||[]).reduce(function(a,b){return a+(b.xp||0)},0)}
function totalXp(hid){
  var c=S.checks[hid]||{},t=0,weeks={};
  for(var ds in c){var x=dayXp(hid,ds);t+=x;var wk=fmt(monday(parse(ds)));weeks[wk]=(weeks[wk]||0)+x}
  if(S.settings.weeklyBonus>0)for(var w in weeks)if(weeks[w]>=S.settings.weeklyGoal)t+=S.settings.weeklyBonus;
  return Math.max(0,t+boostXp(hid));
}
function need(L){return Math.min(100+(L-1)*40,800)}
function levelInfo(xp){var L=1,rem=xp;while(rem>=need(L)){rem-=need(L);L++}return {level:L,cur:rem,need:need(L),pct:rem/need(L)*100}}
function rank(L){var t=['Rekryt','Lärling','Äventyrare','Riddare','Krigare','Mästare','Hjältemästare','Drakdödare','Legend','Mytisk legend','Odödlig','Titan','Halvgud','Gudalik','Väktare','Erövrare','Stormbringare','Skuggjägare','Stjärnriddare','Rymdkapten','Drakryttare','Tidsvandrare','Eldsjäl','Mästerstrateg','Stormästare','Himmelsväktare','Kosmisk krigare','Universums väktare','Evig legend','Urkraft','Stjärnsmed','Nattvakt','Åskryttare','Frostväktare','Eldväktare','Skuggmästare','Tidsmästare','Drakhärskare','Rymdvandrare','Kosmisk väktare','Stjärnhärskare','Universums mästare','Odödlig härskare','Evighetens väktare','Galaxens hjälte','Himlens härskare','Världsskapare','Urtidsdrake','Skapelsens väktare','Ultimat legend'];return t[Math.min(L,t.length)-1]}
function streak(hid){
  var d=new Date(),today=fmt(d),n=0,guard=0;
  while(guard++<400){
    if(((d.getDay()+6)%7)<5){
      var st=dayState(hid,fmt(d));
      if(st==='good'||st==='perfect')n++;
      else if(st!=='off'&&fmt(d)!==today)break;
    }
    d=addDays(d,-1);
  }
  return n;
}
function perfectDays(hid){var c=S.checks[hid]||{};return Object.keys(c).filter(function(ds){return dayState(hid,ds)==='perfect'}).length}

/* ---------- avatar (mecha) ---------- */
/* ===================== MECH ENGINE ===================== */
var MX={n:0},CAP=null;
function hx(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function rgx(a){return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16)}).join('')}
function shade(h,k){var a=hx(h);return rgx(a.map(function(v){return k>=0?v+(255-v)*k:v*(1+k)}))}
function r1(n){return Math.round(n*10)/10}
function pd(p){return 'M'+p.map(function(a){return r1(a[0])+' '+r1(a[1])}).join(' L')+'Z'}
function ctr(p){var x=0,y=0;p.forEach(function(a){x+=a[0];y+=a[1]});return [x/p.length,y/p.length]}
function ins(p,k){var c=ctr(p);return p.map(function(a){return [c[0]+(a[0]-c[0])*k,c[1]+(a[1]-c[1])*k]})}
function MR(g){return '<g transform="translate(300 0) scale(-1 1)">'+g+'</g>'}
function SY(g){return g+MR(g)}
function plate(p,fill,o){
  o=o||{};
  var s='<path d="'+pd(p)+'" fill="'+fill+'" stroke="#05070b" stroke-opacity=".95" stroke-width="'+((o.sw||1.2)*1.35)+'" stroke-linejoin="miter" stroke-miterlimit="4"/>';
  if(o.inn!==0){s+='<path d="'+pd(ins(p,o.inn||.78))+'" fill="#fff" fill-opacity="'+(o.io===undefined?.04:o.io*.35)+'" stroke="#000" stroke-opacity=".38" stroke-width=".9" stroke-linejoin="miter"/>'}
  if(o.hl!==false){var i=o.hi||0,a=p[i],b=p[(i+1)%p.length];s+='<path d="M'+r1(a[0])+' '+r1(a[1])+' L'+r1(b[0])+' '+r1(b[1])+'" stroke="#fff" stroke-opacity=".32" stroke-width="1" stroke-linecap="butt"/>'}
  return s;
}
function ln(d,col,w,op){return '<path d="'+d+'" fill="none" stroke="'+(col||'#000')+'" stroke-opacity="'+(op===undefined?.55:op)+'" stroke-width="'+(w||1)+'" stroke-linecap="round" stroke-linejoin="round"/>'}
function ci(x,y,r,fill,op){return '<circle cx="'+r1(x)+'" cy="'+r1(y)+'" r="'+r+'" fill="'+fill+'"'+(op?' fill-opacity="'+op+'"':'')+' stroke="#06080d" stroke-opacity=".6" stroke-width="1"/>'}
function dotc(x,y,r,fill,op){return '<circle cx="'+r1(x)+'" cy="'+r1(y)+'" r="'+r+'" fill="'+fill+'"'+(op?' fill-opacity="'+op+'"':'')+'/>'}
function vents(x,y,w,n,gap,col,op){var s='';for(var i=0;i<n;i++)s+='<path d="M'+x+' '+(y+i*gap)+' h'+w+'" stroke="'+(col||'#000')+'" stroke-opacity="'+(op||.55)+'" stroke-width="1.6" stroke-linecap="round"/>';return s}
function glow(K,g,std){return '<g class="fxg" filter="url(#'+K.id+(std?'F':'f')+')">'+g+'</g>'}
function rect(x,y,w,h,fill,r,sw){return '<rect x="'+r1(x)+'" y="'+r1(y)+'" width="'+r1(w)+'" height="'+r1(h)+'" rx="'+(r||0)+'" fill="'+fill+'" stroke="#06080d" stroke-opacity=".6" stroke-width="'+(sw||1)+'"/>'}
function grad(id,c){return '<linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+shade(c,.45)+'"/><stop offset=".4" stop-color="'+c+'"/><stop offset="1" stop-color="'+shade(c,-.5)+'"/></linearGradient>'}
function mechK(P,id){
  var d=P.d||shade(P.m,-.62);
  var defs='<defs>'+grad(id+'m',P.m)+grad(id+'s',P.m2)+grad(id+'t',P.t)+grad(id+'d',d)+
   '<linearGradient id="'+id+'k" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9ff"/><stop offset=".45" stop-color="#a3aec4"/><stop offset="1" stop-color="#4a5368"/></linearGradient>'+
   '<linearGradient id="'+id+'e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="'+P.g+'"/><stop offset="1" stop-color="'+shade(P.g,-.4)+'"/></linearGradient>'+
   '<radialGradient id="'+id+'o"><stop offset="0" stop-color="'+P.g+'" stop-opacity=".95"/><stop offset=".5" stop-color="'+P.g+'" stop-opacity=".35"/><stop offset="1" stop-color="'+P.g+'" stop-opacity="0"/></radialGradient>'+
   '<radialGradient id="'+id+'sh"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'+
   '<filter id="'+id+'f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
   '<filter id="'+id+'F" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
   '</defs>';
  defs=defs.replace('</defs>',varDefs(id)+'</defs>');
  return {id:id,defs:defs,m:'url(#'+id+'m)',s:'url(#'+id+'s)',t:'url(#'+id+'t)',d:'url(#'+id+'d)',k:'url(#'+id+'k)',e:'url(#'+id+'e)',o:'url(#'+id+'o)',g:P.g,mc:P.m,m2c:P.m2,tc:P.t,dc:d,P:P};
}

function hexa(x,y,r,fill){var p=[];for(var i=0;i<6;i++){var a=Math.PI/3*i+Math.PI/6;p.push([x+Math.cos(a)*r,y+Math.sin(a)*r])}return plate(p,fill,{inn:.6,io:.12,hl:false})}

function openModal(html,keep){

function toast(msg){var t=$('#toast');t.textContent=msg;t.className='show';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className=''},2600)}
function requirePin(){
  return new Promise(function(res){
    if(Date.now()<parentUntil){res(true);return}
    openModal('<div class="sheet" style="max-width:360px"><h4>🔐 Föräldrakod</h4><input class="pin" id="pinin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" style="width:100%"><div class="err" id="pinerr"></div><div class="acts"><button class="btn" id="pincancel">Avbryt</button><button class="btn pri" id="pinok">OK</button></div></div>');
    var inp=$('#pinin');inp.focus();
    function ok(){
      if(inp.value===S.settings.pin){parentUntil=Date.now()+5*60*1000;closeModal();res(true)}
      else{$('#pinerr').textContent='Fel kod';var s=$('.sheet');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');inp.value='';inp.focus()}
    }
    $('#pinok').onclick=ok;
    $('#pincancel').onclick=function(){closeModal();res(false)};
    inp.onkeydown=function(e){if(e.key==='Enter')ok();if(e.key==='Escape'){closeModal();res(false)}};

/* ---------- effects ---------- */
function xpPop(rect,text){

  e.style.left=(rect.left+rect.width/2)+'px';e.style.top=rect.top+'px';

}
function confetti(){
  var cols=[heroColor(heroById(selId)),'#e3b341','#ffffff','#e3b341'];

    c.style.left=(Math.random()*100)+'vw';c.style.animationDuration=(1.8+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.5)+'s';

async function tick(btn){
  var ds=btn.dataset.ds,qid=btn.dataset.q,hid=selId;
  if(ds>fmt(new Date()))return;
  if(S.settings.lockTicks){var ok=await requirePin();if(!ok)return}
  var rect=btn.getBoundingClientRect();
  var before=totalXp(hid),lvBefore=levelInfo(before).level;
  var arr=S.checks[hid][ds]||(S.checks[hid][ds]=[]);

  if(lvAfter>lvBefore){setTimeout(function(){levelUp(heroById(hid),lvBefore,lvAfter)},350)}

function giveBoost(){
  var st=boostState(),amt=parseInt(st.amt,10),err=$('#b-err');

  if(!amt){err.textContent='Ange ett belopp';return}
  if(boostTake&&amt>0)amt=-amt;
  var note=st.note.trim()||(amt<0?'Justering':'Extra boost'),ups=[];
  st.ids.forEach(function(hid){
    var before=levelInfo(totalXp(hid)).level,a2=amt;
    if(a2<0)a2=-Math.min(-a2,Math.max(0,totalXp(hid)));
    if(!a2)return;
    S.boosts[hid].push({id:uid('b'),xp:a2,note:note,date:fmt(new Date())});
    var after=levelInfo(totalXp(hid)).level;
    if(after>before)ups.push([hid,before,after]);
  });
  commit();closeModal();
  var names=st.ids.map(function(id){return heroById(id).name}).join(' & ');
  toast(amt<0?('➖ '+(-amt)+' XP borttaget från '+names):('⚡ +'+amt+' XP till '+names));

}
